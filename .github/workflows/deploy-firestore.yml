# Despliega solo Firestore Security Rules al hacer push a main.
#
# Configura en GitHub → Settings → Secrets → Actions:
#   FIREBASE_TOKEN   → salida de: firebase login:ci
#
# El sitio estático en Vercel suele actualizarse solo al conectar este repo
# en el dashboard de Vercel (no hace falta duplicar deploy aquí).

name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firestore.yml'
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --non-interactive
